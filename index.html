    <!-- Structured Data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "name": "Ask Ireland Civic Search & Calculator",

    <!-- Structured Data: FAQPage (Top Irish Civic Inquiries) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I stop emergency tax and get a refund in Ireland?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "To stop emergency tax, obtain your employer's 8-character Tax Registration Number (TRN), log into Revenue myAccount, navigate to PAYE Services, and select 'Add Job or Pension'. Once your employer receives the Revenue Payroll Notification (RPN), any overpaid emergency tax is automatically refunded in your next payroll cycle."
          }
        },
        {
          "@type": "Question",
          "name": "When can I upgrade from Stamp 1 to Stamp 4 under Critical Skills?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Holders of a Critical Skills Employment Permit (CSEP) are eligible to apply for a DETE Support Letter at 21 months of continuous employment, allowing registration for Stamp 4 immigration permission at the 2-year mark without waiting 24 full months to begin the application."
          }
        },
        {
          "@type": "Question",
          "name": "How many reckonable days are needed for Irish citizenship by naturalisation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Standard Irish citizenship by naturalisation requires 5 years (1,825 days) of reckonable residence within the preceding 8 years, including 1 full continuous year (365 days) immediately prior to your application date."
          }
        },
        {
          "@type": "Question",
          "name": "What documents are required to obtain a PPS Number in Ireland?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Applicants must present a valid passport or national identity card, verifiable proof of Irish address (utility bill, tenancy agreement, or host declaration), and documented proof of a statutory transaction requiring a PPSN (such as an employment offer letter or tax registration requirement)."
          }
        }
      ]
    }
    </script>
